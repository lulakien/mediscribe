name: Headless workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install portable headless dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-headless.txt pytest

      - name: Run headless tests
        run: python -m pytest -q tests/test_headless_runner.py

      - name: Run keyless cloud doctor
        run: >-
          python scripts/mediscribe_doctor.py
          --profile cloud
          --input tests/fixtures/headless-input
          --output .ci/headless-doctor
          --dry-run
          --json

      - name: Compile portable modules
        run: python -m py_compile scripts/*.py shared/transcribe_core.py
